name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Both scripts build Wasm first (pretest / prebuild).
      - run: npm test -- --no-watch
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
      # Pages serves the site from /<repo>/, so the base href must match the repository name.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # SPA fallback: Pages returns 404.html for unknown paths (e.g. a reload on /settings),
      # so it must be the app itself to let the Angular router handle the URL.
      - run: cp dist/market-app/browser/index.html dist/market-app/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/market-app/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
